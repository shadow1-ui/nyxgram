name: Nyxgram interface checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/check_nyx_startup.py
      - run: python3 tools/test_nyx_deleted.py
      - run: python3 tools/test_nyx_interface.py
