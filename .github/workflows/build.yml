name: Build Nyxgram

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Опубликовать проверенное обновление в GitHub Releases'
        required: false
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths-ignore: [ '**.md' ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /
          free -h; nproc

      - name: Add swap (8 GB)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/nyx.swap
          sudo chmod 600 /mnt/nyx.swap
          sudo mkswap /mnt/nyx.swap
          sudo swapon /mnt/nyx.swap
          free -h

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up ccache (кэш нативной сборки)
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nyx-native-arm64
          max-size: 4G

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Set monotonic Nyxgram build version
        run: |
          CODE=$((7200 + GITHUB_RUN_NUMBER))
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$CODE/" gradle.properties

      - name: Inject Telegram API keys
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then echo "::error::Secrets API_ID / API_HASH are not set"; exit 1; fi
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/public static int APP_ID = [0-9]+;/public static int APP_ID = ${API_ID};/" "$F"
          sed -i -E "s/public static String APP_HASH = \"[0-9a-f]+\";/public static String APP_HASH = \"${API_HASH}\";/" "$F"
          grep -q "APP_ID = ${API_ID};" "$F" || { echo "::error::Failed to inject API_ID"; exit 1; }

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore

      - name: Check Java before native build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac :TMessagesProj_App:compileAfatReleaseJavaWithJavac --stacktrace --no-daemon --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Build APK (arm64-v8a)
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace --no-daemon --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx10g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC" \
            -PRELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD" -PRELEASE_KEY_PASSWORD="$KEYSTORE_PASSWORD" -PRELEASE_KEY_ALIAS=nyxgram \
            -Dkotlin.compiler.execution.strategy=in-process
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n1)
          cp "$APK" "out/Nyxgram-${GITHUB_RUN_NUMBER}-arm64.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Nyxgram-${{ github.run_number }}-arm64
          path: out/*.apk
          retention-days: 30

      - name: Prepare verified update manifest
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, re
          apk = next(pathlib.Path('out').glob('*.apk'))
          props = pathlib.Path('gradle.properties').read_text()
          code = int(re.search(r'^APP_VERSION_CODE=(\d+)', props, re.M).group(1)) * 10 + 9
          manifest = {'package': 'com.nyxgram.android', 'versionCode': code, 'version': '0.4.1', 'apk': apk.name,
                      'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(), 'size': apk.stat().st_size}
          pathlib.Path('out/nyx-update.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PYCODE

      - name: Upload update metadata
        uses: actions/upload-artifact@v4
        with:
          name: Nyxgram-${{ github.run_number }}-update-manifest
          path: out/nyx-update.json
          retention-days: 30

      - name: Publish tested release or prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ inputs.publish_release }}
        run: |
          TAG="nyx-0.4.1-build-${GITHUB_RUN_NUMBER}"
          EXTRA="--draft"
          if [ "$PUBLISH" = "true" ]; then EXTRA=""; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.apk out/nyx-update.json --clobber
            if [ "$PUBLISH" = "true" ]; then gh release edit "$TAG" --draft=false; fi
          else
            gh release create "$TAG" out/*.apk out/nyx-update.json $EXTRA --title "Nyxgram 0.4.1 · сборка ${GITHUB_RUN_NUMBER}" --notes-file NYXGRAM_RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
